[package]
name = "spectraguard"
version = "0.1.0"
edition = "2021"
description = "Passive real-time Wireless Intrusion Detection System and RF Spectrum Anomaly Monitor"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
mime_guess = "2.0"
num-complex = "0.4"
rand = "0.8"
rand_distr = "0.4"
rust-embed = "8.5"
rustfft = "6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
hardware = []